# Docker profile — used when running inside Docker Compose
spring:
  flyway:
    locations: classpath:db/migration,classpath:db/seed/dev
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}

mxsuite:
  security:
    jwt:
      secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost}

management:
  tracing:
    enabled: ${OTEL_TRACING_ENABLED:false}

logging:
  level:
    com.mxsuite: INFO
